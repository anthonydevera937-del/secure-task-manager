<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Dynamic Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">EDP • Laboratory Activity</p>
      <h1>Secure Dynamic Task Manager</h1>
      <p class="subtitle">Organize your tasks, one step at a time.</p>
    </header>

    <section class="task-panel" aria-label="Task manager">
      <form id="taskForm" class="task-form" novalidate>
        <label for="taskInput">New task</label>
        <div class="input-row">
          <input id="taskInput" type="text" placeholder="Enter a task" autocomplete="off">
          <button id="addTaskBtn" class="primary-btn" type="submit">Add Task</button>
        </div>
        <p id="taskMessage" class="message" role="alert" aria-live="polite"></p>
      </form>

      <div class="list-heading">
        <h2>Your tasks</h2>
        <button id="loadSamplesBtn" class="secondary-btn" type="button">
          Load Sample Tasks
        </button>
      </div>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>

      <section class="summary" aria-label="Task summary">
        <div class="summary-card">
          <span class="summary-label">Total Tasks</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="summary-card">
          <span class="summary-label">Pending</span>
          <strong id="pendingCount">0</strong>
        </div>
        <div class="summary-card">
          <span class="summary-label">Completed</span>
          <strong id="completedCount">0</strong>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
