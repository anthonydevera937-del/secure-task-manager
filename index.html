<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Dynamic Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">Stay focused</p>
      <h1>Secure Dynamic Task Manager</h1>
      <p class="intro">Add, complete, edit, and remove your tasks.</p>
    </header>

    <form id="taskForm" class="task-form">
      <label for="taskInput">New task</label>
      <div class="input-row">
        <input
          id="taskInput"
          type="text"
          placeholder="Enter a task"
          autocomplete="off"
        >
        <button id="addTaskBtn" type="submit">Add Task</button>
      </div>
      <p id="taskMessage" class="message" role="alert" aria-live="polite"></p>
    </form>

    <div class="toolbar">
      <h2>Your tasks</h2>
      <button id="loadSamplesBtn" class="secondary-btn" type="button">
        Load Sample Tasks
      </button>
    </div>

    <ul id="taskList" class="task-list" aria-label="Task list"></ul>

    <section class="summary" aria-label="Task summary">
      <div class="summary-card">
        <span class="summary-label">Total Tasks</span>
        <strong id="totalCount">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Pending</span>
        <strong id="pendingCount">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Completed</span>
        <strong id="completedCount">0</strong>
      </div>
    </section>
  </main>
</body>
</html>
